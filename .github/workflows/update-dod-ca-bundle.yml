---
name: Update DoD CA bundle checksum

"on":
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

concurrency:
  group: update-dod-ca-bundle-checksum
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Check for DoD CA bundle updates
    runs-on: ubuntu-latest
    env:
      UPDATE_BRANCH: automation/update-dod-ca-bundle

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check bundle checksum
        id: bundle
        shell: bash
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/authorized_certs.zip"
          url="https://dl.dod.cyber.mil/wp-content/uploads/pki-pke/zip/"
          url+="unclass-dod_approved_external_pkis_trust_chains.zip"
          checksum_file="src/truststore/authorized_certs.zip.sha256"
          old_sha="$(tr -d '[:space:]' < "${checksum_file}")"

          curl -fsSL \
            --proto '=https' \
            --proto-redir '=https' \
            "${url}" \
            -o "${archive}"
          unzip -tq "${archive}"

          new_sha="$(shasum -a 256 "${archive}" | cut -d ' ' -f1)"
          echo "old_sha=${old_sha}" >> "${GITHUB_OUTPUT}"
          echo "new_sha=${new_sha}" >> "${GITHUB_OUTPUT}"

          if [ "${new_sha}" = "${old_sha}" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "changed=true" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${new_sha}" > "${checksum_file}"

      - name: Open or update pull request
        if: steps.bundle.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_SHA: ${{ steps.bundle.outputs.old_sha }}
          NEW_SHA: ${{ steps.bundle.outputs.new_sha }}
        run: |
          set -euo pipefail

          bot_id="41898282"
          git config user.name "github-actions[bot]"
          git config user.email \
            "${bot_id}+github-actions[bot]@users.noreply.github.com"
          update_ref="refs/heads/${UPDATE_BRANCH}"
          remote_ref="refs/remotes/origin/${UPDATE_BRANCH}"
          git fetch origin "${update_ref}:${remote_ref}" || true
          git checkout -B "${UPDATE_BRANCH}" "${GITHUB_SHA}"
          git add src/truststore/authorized_certs.zip.sha256
          git commit -m "chore: update DoD CA bundle digest"
          gh auth setup-git
          git push --force-with-lease origin "HEAD:${update_ref}"

          body_file="${RUNNER_TEMP}/pr-body.md"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs"
          run_url="${run_url}/${GITHUB_RUN_ID}"
          cat > "${body_file}" <<EOF_BODY
          ## DoD CA bundle update detected

          - Previous SHA-256: \`${OLD_SHA}\`
          - Proposed SHA-256: \`${NEW_SHA}\`
          - Workflow run: ${run_url}

          Do not merge this PR based only on the generated checksum.
          Confirm that the upstream bundle changed legitimately before
          approving it.
          EOF_BODY

          pr_number="$(gh pr list \
            --head "${UPDATE_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "${pr_number}" ]; then
            gh pr edit "${pr_number}" \
              --title "chore: update DoD CA bundle digest" \
              --body-file "${body_file}"
          else
            gh pr create \
              --base main \
              --head "${UPDATE_BRANCH}" \
              --title "chore: update DoD CA bundle digest" \
              --body-file "${body_file}"
          fi
